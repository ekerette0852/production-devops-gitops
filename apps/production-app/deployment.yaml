apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-web
  labels:
    app: production-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-web
  template:
    metadata:
      labels:
        app: production-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: production-web
          image: ghcr.io/ekerette0852/production-devops-platform:3a720f3
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
