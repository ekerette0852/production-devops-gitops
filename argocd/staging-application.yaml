apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-web
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ekerette0852/production-devops-gitops.git
    targetRevision: main
    path: apps/staging-app

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
