apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-web
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ekerette0852/production-devops-gitops.git
    targetRevision: main
    path: apps/production-app

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
